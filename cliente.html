<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kellen Cortadores – Conversa</title>
<link rel="manifest" href="manifest-cliente.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#6B2D5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kellen">
<style>
:root{--bg:#F6F2FA;--surf:#fff;--ink:#2A1F2D;--mute:#6D6174;--line:#E4DCEC;--berry:#6B2D5C;--butter:#FFE9A8;--theirs:#EFE8F5}
@media(prefers-color-scheme:dark){:root{--bg:#1B1420;--surf:#261C2C;--ink:#F3ECF7;--mute:#B2A5BA;--line:#3A2D42;--berry:#E7A6D6;--theirs:#34273C}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;line-height:1.4}
.app{max-width:480px;height:100%;margin:0 auto;background:var(--surf);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--berry);color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center}
@media(prefers-color-scheme:dark){header{color:#2A1F2D}}
.logo{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover;background:#fff}
header b{display:block;line-height:1.1}header small{opacity:.85}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:12px}
.m{max-width:80%;padding:8px 11px;border-radius:16px;word-wrap:break-word;white-space:pre-wrap}
.m small{display:block;opacity:.65;font-size:.7rem;margin-top:2px}
.m img{display:block;width:240px;max-width:100%;max-height:300px;object-fit:cover;border-radius:10px;cursor:zoom-in;margin-bottom:4px}
.me{align-self:flex-end;background:var(--berry);color:#fff;border-bottom-right-radius:4px}
@media(prefers-color-scheme:dark){.me{color:#2A1F2D}}
.other{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:4px}
form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:11px 14px;font:inherit;font-size:16px}
button{border:0;background:var(--berry);color:#fff;border-radius:999px;padding:0 18px;font:inherit;font-weight:600}
@media(prefers-color-scheme:dark){button{color:#2A1F2D}}
button:focus-visible,input:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.clip{display:grid;place-items:center;flex:none;width:46px;border:1px solid var(--line);border-radius:999px;color:var(--berry);cursor:pointer}
.clip:focus-within{outline:3px solid var(--butter);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;border:0;opacity:0;overflow:hidden}
#nome{padding:24px 16px;display:none;flex-direction:column;gap:10px}
#nome p{margin:0;font-weight:600}
#nome button{padding:11px 18px}
#erro{color:#B3261E;padding:12px;display:none}
#aviso{color:var(--mute);font-size:.85rem;padding:4px 12px;display:none}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#zoom.on{display:flex}
#zoom img{max-width:100%;max-height:100%;border-radius:8px}
.pc{display:block;text-decoration:none;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:4px}
.pc img{display:block;width:220px;max-width:100%;max-height:220px;object-fit:cover;margin:0;border-radius:0;cursor:pointer}
.pc b{display:block;padding:6px 10px 0}
.pc span{display:block;padding:0 10px 8px;font-size:.8rem;color:var(--mute)}
#atalhos{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px 0}
#atalhos button{padding:6px 12px;font-size:.85rem;background:none;color:var(--berry);border:1px solid var(--line)}
#sug .pc{display:grid;grid-template-columns:56px 1fr;column-gap:10px;align-items:center;padding:6px;margin:6px 10px 0}
#sug .pc img{grid-row:1/3;width:56px;height:56px;max-height:none;border-radius:8px}
#sug .pc b,#sug .pc span{padding:0}
#atalhos:empty,#sug:empty{display:none}
</style>
</head>
<body>
<div class="app">
<header><img class="logo" src="logo.png" alt="Logomarca Kellen Cortadores" width="44" height="44"><div><b>Kellen Cortadores</b><small>Responde em poucos minutos</small></div></header>
<div id="erro"></div>
<div id="nome"><p>Como você se chama?</p><input id="nomeIn" placeholder="Seu nome" autocomplete="given-name"><button id="nomeOk" type="button">Começar conversa</button></div>
<div id="msgs" aria-live="polite"></div>
<div id="aviso"></div>
<div id="atalhos"></div><div id="sug"></div>
<form id="f">
<label class="clip" aria-label="Enviar foto"><input id="foto" class="sr" type="file" accept="image/*"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></label>
<input id="txt" placeholder="Escreva sua mensagem" autocomplete="off" aria-label="Mensagem"><button>Enviar</button>
</form>
</div>
<div id="zoom" role="dialog" aria-label="Foto ampliada"><img alt="Foto ampliada"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,query,orderBy,onSnapshot,serverTimestamp,increment,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
import {CATALOGO_URL,ATALHOS} from "./loja-config.js";

const $=i=>document.getElementById(i);
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let uid=null,nome="";
try{nome=localStorage.getItem("nome")||""}catch(e){}

// ---- som de aviso quando a loja responde (gerado pelo navegador, sem arquivo) ----
let ctx=null;
function preparar(){
  try{
    if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==="suspended")ctx.resume();
  }catch(e){}
}
function plim(){
  preparar();if(!ctx)return;
  const t=ctx.currentTime;
  [[880,0],[1318.5,.14]].forEach(([f,d])=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t+d);
    g.gain.exponentialRampToValueAtTime(0.5,t+d+.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d+.5);
    o.connect(g);g.connect(ctx.destination);
    o.start(t+d);o.stop(t+d+.55);
  });
}
// o navegador só libera o som depois de um toque/clique na página
document.addEventListener("pointerdown",preparar);
document.addEventListener("keydown",preparar);

function erro(t){$("erro").style.display=t?"block":"none";$("erro").textContent=t||""}
function aviso(t){$("aviso").style.display=t?"block":"none";$("aviso").textContent=t||""}
function hora(ts){var d=ts&&ts.toDate?ts.toDate():new Date();return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function ampliar(src){$("zoom").firstElementChild.src=src;$("zoom").classList.add("on")}
$("zoom").onclick=()=>$("zoom").classList.remove("on");

// reduz a foto até caber com folga no limite de 1 MB por documento do Firestore
function reduzir(file){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      for(const [lado,q] of [[1000,.7],[800,.6],[600,.5],[400,.5]]){
        const r=Math.min(1,lado/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));
        const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
        x.drawImage(img,0,0,c.width,c.height);
        const d=c.toDataURL("image/jpeg",q);
        if(d.length<900000)return ok(d);
      }
      no(new Error("imagem grande demais"));
    };
    img.onerror=()=>no(new Error("formato de imagem não aceito"));
    img.src=url;
  });
}

async function enviar(dados,resumo){
  const b=writeBatch(db);
  b.set(doc(collection(db,"chats",uid,"messages")),{de:"cliente",...dados,criado:serverTimestamp()});
  b.set(doc(db,"chats",uid),{nome:nome||"Cliente",ultima:resumo,atualizado:serverTimestamp(),naoLidas:increment(1)},{merge:true});
  await b.commit();
}

function escutar(){
  const q=query(collection(db,"chats",uid,"messages"),orderBy("criado"));
  let primeira=true;
  onSnapshot(q,snap=>{
    // toca quando chega mensagem nova da loja
    if(!primeira&&snap.docChanges().some(ch=>ch.type==="added"&&!ch.doc.metadata.hasPendingWrites&&ch.doc.data().de==="loja"))plim();
    primeira=false;
    const box=$("msgs");box.innerHTML="";
    snap.forEach(d=>{
      const m=d.data(),el=document.createElement("div");
      el.className="m "+(m.de==="cliente"?"me":"other");
      if(m.tipo==="produto"&&m.de==="loja"&&okUrl(m.url)&&okUrl(m.imagem)){el.appendChild(cartao(m.titulo,m.url,m.imagem))}else if(m.imagem){
        const i=document.createElement("img");i.src=m.imagem;i.alt="Foto enviada";
        i.onclick=()=>ampliar(m.imagem);i.onload=()=>{box.scrollTop=box.scrollHeight};
        el.appendChild(i);
      }
      if(m.texto)el.appendChild(document.createTextNode(m.texto));
      const s=document.createElement("small");s.textContent=hora(m.criado);el.appendChild(s);
      box.appendChild(el);
    });
    box.scrollTop=box.scrollHeight;
  },e=>erro("Não consegui carregar a conversa: "+e.code));
}

function iniciar(){
  $("nome").style.display="none";$("f").style.display="flex";$("msgs").style.display="flex";
  escutar();
}

$("nomeOk").onclick=()=>{
  const v=$("nomeIn").value.trim();if(!v)return;
  nome=v;try{localStorage.setItem("nome",v)}catch(e){}
  iniciar();
};

$("f").onsubmit=async e=>{
  e.preventDefault();
  const t=$("txt").value.trim();if(!t||!uid)return;
  $("txt").value="";sugerir();erro("");
  try{await enviar({texto:t},t)}
  catch(err){erro("Não consegui enviar: "+(err.code||err.message))}
};

$("foto").onchange=async()=>{
  const file=$("foto").files[0];$("foto").value="";
  if(!file||!uid)return;
  const legenda=$("txt").value.trim();
  erro("");aviso("Enviando foto…");
  try{
    const img=await reduzir(file);
    await enviar({texto:legenda,imagem:img},"📷 "+(legenda||"Foto"));
    $("txt").value="";
  }catch(err){erro("Não consegui enviar a foto: "+(err.code||err.message))}
  aviso("");
};


const okUrl=s=>typeof s==="string"&&s.startsWith(CATALOGO_URL);
const sem=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function cartao(t,u,i,sub){
  const a=document.createElement("a");a.className="pc";a.href=u;a.target="_blank";a.rel="noopener";
  if(i){const im=document.createElement("img");im.src=i;im.alt="";im.loading="lazy";a.appendChild(im)}
  const b=document.createElement("b");b.textContent=t||"Produto";a.appendChild(b);
  const s=document.createElement("span");s.textContent=sub||"Toque para ver os modelos";a.appendChild(s);
  return a;
}
// catálogo: produtos.json gerado pelo Gerenciador_de_Catálogo.py
let produtos=[];
fetch(CATALOGO_URL+"produtos.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{
  produtos=(j.produtos||[]).map(p=>({...p,_w:sem([p.titulo,p.tema,...(p.palavras||[])].join(" ")).split(/[^a-z0-9]+/).filter(Boolean)}));
}).catch(()=>{});

ATALHOS.forEach(([nome,alvo])=>{
  const b=document.createElement("button");b.type="button";b.textContent=nome;
  b.onclick=()=>{if(/^https?:/.test(alvo))window.open(alvo,"_blank","noopener");else{$("txt").value=alvo;$("txt").focus()}};
  $("atalhos").appendChild(b);
});
const IGNORAR=new Set(["para","pode","tem","voce","voces","quero","queria","preciso","gostaria","tenho","bom","boa","dia","tarde","noite","cortador","cortadore","biscoito","pedido","orcamento","valor","preco","quanto","fazer","esse","essa","isso"]);
// enquanto a cliente digita, mostra o produto do catálogo que combina
function sugerir(){
  const box=$("sug");box.textContent="";
  const ws=sem($("txt").value).split(/[^a-z0-9]+/).map(w=>w.replace(/s$/,"")).filter(w=>w.length>=4&&!IGNORAR.has(w));
  if(!ws.length)return;
  produtos.filter(p=>ws.some(w=>p._w.some(k=>w.length<5?k===w:k.startsWith(w)))).slice(0,2)
    .forEach(p=>box.appendChild(cartao(p.titulo,CATALOGO_URL+p.url,p.imagem&&CATALOGO_URL+p.imagem,"Temos esse tema! Toque para ver")));
}
$("txt").addEventListener("input",sugerir);

onAuthStateChanged(auth,u=>{
  if(!u)return;
  uid=u.uid;
  if(nome)iniciar();
  else{$("nome").style.display="flex";$("f").style.display="none";$("msgs").style.display="none"}
});
signInAnonymously(auth).catch(e=>erro("Falha ao entrar: "+e.code));
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
