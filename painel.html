<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de atendimento</title>
<link rel="manifest" href="manifest-painel.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#6B2D5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<style>
:root{--bg:#F6F2FA;--surf:#fff;--ink:#2A1F2D;--mute:#6D6174;--line:#E4DCEC;--berry:#6B2D5C;--butter:#FFE9A8;--theirs:#EFE8F5}
@media(prefers-color-scheme:dark){:root{--bg:#1B1420;--surf:#261C2C;--ink:#F3ECF7;--mute:#B2A5BA;--line:#3A2D42;--berry:#E7A6D6;--theirs:#34273C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;line-height:1.4}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 12px}
#login{max-width:340px;display:flex;flex-direction:column;gap:8px}
input,textarea{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;min-width:0}
button{border:0;background:var(--berry);color:#fff;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#2A1F2D}}
button:focus-visible,input:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
#erro{color:#B3261E;margin:8px 0}
#desk{display:none;background:var(--surf);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.top{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.top span{color:var(--mute);font-size:.85rem}
.top button{background:none;color:var(--mute);border:1px solid var(--line);padding:4px 10px;font-weight:400}
.cols{display:grid;grid-template-columns:230px 1fr;min-height:460px}
@media(max-width:600px){.cols{grid-template-columns:1fr}}
#list{border-right:1px solid var(--line);overflow:auto;max-height:560px}
@media(max-width:600px){#list{border-right:0;border-bottom:1px solid var(--line);max-height:200px}}
#list button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:6px;text-align:left;border-radius:0;background:none;color:var(--ink);font-weight:400;border-bottom:1px solid var(--line);padding:12px 14px}
#list button[aria-current="true"]{background:var(--theirs)}
#list small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.badge{background:var(--berry);color:#fff;border-radius:999px;min-width:22px;text-align:center;font-size:.75rem;padding:1px 6px}
@media(prefers-color-scheme:dark){.badge{color:#2A1F2D}}
.conv{display:flex;flex-direction:column;padding:12px;min-height:320px}
.titulo{font-weight:700;padding:0 0 8px;margin-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
#apagar{display:none;background:none;color:#B3261E;border:1px solid var(--line);padding:4px 10px;font-weight:400}
@media(prefers-color-scheme:dark){#apagar{color:#F2B8B5}}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;max-height:460px}
.m{max-width:80%;padding:8px 11px;border-radius:16px;word-wrap:break-word;white-space:pre-wrap}
.m.int{border:2px dashed var(--berry,#8C2F5C)}
.m .tagint{display:block;font-size:.72rem;opacity:.8;margin-bottom:4px}
.m .arq img{background:#fff;object-fit:contain;cursor:default;width:220px;max-height:200px}
.m .arq .bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.m small{display:block;opacity:.65;font-size:.7rem;margin-top:2px}
.m img{display:block;width:260px;max-width:100%;max-height:320px;object-fit:cover;border-radius:10px;cursor:zoom-in;margin-bottom:4px}
.me{align-self:flex-end;background:var(--berry);color:#fff;border-bottom-right-radius:4px}
@media(prefers-color-scheme:dark){.me{color:#2A1F2D}}
.other{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:4px}
.m button.copiar{display:block;margin-top:8px;background:var(--surf);color:var(--ink);border:1px solid var(--line);padding:6px 12px;font-size:.85rem}
#menuFoto{position:fixed;z-index:20;display:flex;flex-direction:column;min-width:230px;background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);overflow:hidden}
#menuFoto button{background:none;color:var(--ink);border-radius:0;text-align:left;font-weight:500;padding:10px 14px}
#menuFoto button:hover,#menuFoto button:focus-visible{background:var(--theirs)}
.empty{color:var(--mute);margin:auto;text-align:center}
#f{display:flex;gap:6px;margin-top:8px}
#f input[type=text],#f input:not([type]){flex:1}
#f textarea{flex:1;resize:none;field-sizing:content;min-height:44px;max-height:180px;line-height:1.35}
.clip{display:grid;place-items:center;flex:none;width:44px;border:1px solid var(--line);border-radius:10px;color:var(--berry);cursor:pointer}
.clip:focus-within{outline:3px solid var(--butter);outline-offset:2px}
.m audio{display:block;width:250px;max-width:100%;margin-bottom:4px}
.m:has(audio){width:min(290px,88%);max-width:88%}
button.mic,button#lupa{background:none;color:var(--berry);padding:0}
button#lupa{font-size:1.15rem}
#fMarca #mCat{display:flex;flex-direction:column;gap:6px}
#fMarca #mCat[hidden]{display:none}
#fMarca #mSel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--ink)}
#grav{display:none;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 10px 0;padding:10px;border:2px solid var(--berry);border-radius:12px;font-size:.9rem}
#grav.on{display:flex}
#grav span,#grav audio{flex:1 1 100%;width:100%}
#grav button{padding:8px 14px;border-radius:999px}
#grav button.sec{background:none;color:var(--berry);border:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;padding:0;border:0;opacity:0;overflow:hidden}
#aviso{color:var(--mute);font-size:.85rem;margin-top:6px;display:none}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#zoom.on{display:flex}
#zoom img{max-width:100%;max-height:100%;border-radius:8px}
.pc{display:block;text-decoration:none;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:4px}
.pc img{display:block;width:220px;max-width:100%;max-height:220px;object-fit:cover;margin:0;border-radius:0;cursor:pointer}
.pc b{display:block;padding:6px 10px 0}
.pc span{display:block;padding:0 10px 8px;font-size:.8rem;color:var(--mute)}
#rap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#rap button{background:none;color:var(--berry);border:1px solid var(--line);padding:4px 10px;font-weight:500;font-size:.85rem}
#busca,#mBusca{width:100%;margin-top:8px}
#busca[hidden]{display:none}
#res,#mRes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;color:var(--mute);font-size:.85rem}
#res button,#mRes button{display:flex;align-items:center;gap:6px;background:var(--theirs);color:var(--ink);font-weight:500;padding:4px 10px 4px 4px;font-size:.85rem}
#res img,#mRes img{width:36px;height:36px;object-fit:cover;border-radius:6px}
#sit{display:none;font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:3px 6px}
.m a:not(.pc){color:inherit;text-decoration:underline;word-break:break-all}
#renBtn,#lembBtn,#pedBtn{display:none;background:none;color:var(--berry);border:1px solid var(--line);padding:4px 10px;font-weight:500;font-size:.85rem}
#lemb{margin:0 0 8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
#lemb[hidden]{display:none}
#lemb .ch,#lemb .lin{display:flex;flex-wrap:wrap;gap:6px}
#lemb .ch button{background:none;color:var(--berry);border:1px solid var(--line);padding:4px 10px;font-weight:500;font-size:.85rem}
#lemb .lin input{flex:1;min-width:180px}
#lembDel{background:none;color:#B3261E;border:1px solid var(--line);font-weight:400}
@media(prefers-color-scheme:dark){#lembDel{color:#F2B8B5}}
.lemb-on{color:var(--berry)!important;font-weight:600}
.lemb-due{color:#B3261E!important;font-weight:700}
@media(prefers-color-scheme:dark){.lemb-on{color:#E7A6D6!important}.lemb-due{color:#F2B8B5!important}}
#alertas{display:none;flex-direction:column;gap:6px;padding:8px 16px;background:var(--butter,#FFE9A8);color:#2A1F2D;border-bottom:1px solid var(--line)}
#alertas.on{display:flex}
#resumo{display:none;flex-direction:column;gap:4px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);max-height:55vh;overflow:auto}
#itens{display:none;flex-direction:column;gap:4px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);max-height:55vh;overflow:auto}
#resumo.on{display:flex}
#itens.on{display:flex}
#resumo h3{margin:8px 0 2px;font-size:.9rem;color:var(--berry)}
#itens h3{margin:8px 0 2px;font-size:.9rem;color:var(--berry)}
#resumo .a{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.9rem}
#itens .a{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.9rem}
#resumo .a span{flex:1;min-width:180px}
#itens .a span{flex:1;min-width:180px}
#resumo .a small{display:block;color:var(--mute)}
#itens .a small{display:block;color:var(--mute)}
#resumo .a button{padding:4px 10px;font-size:.85rem}
#itens .a button{padding:4px 10px;font-size:.85rem}
#resumo .topo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#itens .topo{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#resumo .topo span{flex:1;color:var(--mute);font-size:.8rem}
#itens .topo span{flex:1;color:var(--mute);font-size:.8rem}
#resumo .vazio{color:var(--mute)}
#itens .vazio{color:var(--mute)}
#filaBtn{display:none}
#fila{display:none;flex-direction:column;gap:6px;padding:10px 16px;background:#E3EEFF;color:#1B2A41;border-bottom:1px solid var(--line)}
#fila.on{display:flex}
#fila .a{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#fila .a span{flex:1;min-width:180px}
#fila button{padding:4px 10px;font-size:.85rem;background:#1B2A41;color:#fff}
#fila button.sec{background:none;color:#1B2A41;border:1px solid #1B2A41}
#alertas .a{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#alertas .a span{flex:1;min-width:160px}
#alertas button{padding:4px 10px;font-size:.85rem;background:#2A1F2D;color:#fff}
#alertas button.sec{background:none;color:#2A1F2D;border:1px solid #2A1F2D}

/* ---- pedidos marcados ---- */
.m button.marca{display:block;width:100%;text-align:left;margin:0 0 6px;padding:4px 10px;border-radius:999px;background:var(--butter);color:#2A1F2D;font-size:.8rem;font-weight:700}
.m button.btMarca{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:999px;background:none;color:inherit;border:1px dashed currentColor;font-size:.72rem;font-weight:500;opacity:.75}
@media(hover:hover){.m button.btMarca{opacity:0}.m:hover button.btMarca,.m button.btMarca:focus-visible{opacity:.8}}
.m.marcada{outline:2px solid var(--butter);outline-offset:1px}
.m.flash{animation:pisca 1.6s}
@keyframes pisca{0%,60%{box-shadow:0 0 0 6px var(--butter)}100%{box-shadow:0 0 0 0 transparent}}
#pedidos{margin:0 0 8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px;max-height:40vh;overflow:auto}
#pedidos[hidden]{display:none}
#pedidos .topo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
#pedidos .topo button{background:none;color:var(--berry);border:1px solid var(--line);padding:4px 10px;font-weight:500;font-size:.85rem}
#pedidos .it{display:flex;gap:8px;align-items:flex-start;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surf)}
#pedidos .it img{width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:zoom-in;flex:none}
#pedidos .it .tx{flex:1;min-width:0;font-size:.9rem}
#pedidos .it small{display:block;color:var(--mute)}
#pedidos .it .ob{white-space:pre-wrap;word-wrap:break-word}
#pedidos .it .bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
#pedidos .it .bt button{background:none;color:var(--berry);border:1px solid var(--line);padding:3px 10px;font-weight:500;font-size:.8rem}
#pedidos .vazio{color:var(--mute);font-size:.9rem}
#dlgMarca{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#dlgMarca[hidden]{display:none}
#fMarca{background:var(--surf);color:var(--ink);border-radius:16px;padding:16px;width:min(420px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
#fMarca label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}
#fMarca input,#fMarca textarea,#fMarca select{font:inherit;color:var(--ink)}
#fMarca select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
#fMarca .lin{display:flex;flex-wrap:wrap;gap:6px}
#fMarca .sec{background:none;color:var(--berry);border:1px solid var(--line)}
#fMarca #mDel{background:none;color:#B3261E;border:1px solid var(--line);font-weight:400}
@media(prefers-color-scheme:dark){#fMarca #mDel{color:#F2B8B5}}
</style>
</head>
<body>
<div class="wrap">
<h1>Painel de atendimento</h1>
<form id="login"><input id="em" type="email" placeholder="Seu e-mail" autocomplete="username"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password"><button>Entrar</button></form>
<div id="erro"></div>
<div id="desk">
<div class="top"><b>Conversas</b><span id="count"></span><button id="filaBtn" type="button" aria-expanded="false" aria-controls="fila">📥 Fila</button><button id="itensBtn" type="button" aria-expanded="false" aria-controls="itens">📌 Itens</button><button id="resBtn" type="button" aria-expanded="false" aria-controls="resumo">📋 Pendências</button><button id="som" type="button" aria-pressed="true">🔔 Som ligado</button><button id="sair" type="button">Sair</button></div>
<div id="alertas" role="alert"></div>
<div id="fila" role="region" aria-label="Fila para o notebook"></div>
<div id="itens" role="region" aria-label="Itens marcados em todas as conversas"></div>
<div id="resumo" role="region" aria-label="Pendências de atendimento"></div>
<div class="cols">
<div id="list"></div>
<div class="conv"><div class="titulo"><span id="titulo">Nenhuma conversa aberta</span><select id="sit" aria-label="Situação da conversa"></select><button id="renBtn" type="button">✏️ Renomear</button><button id="pedBtn" type="button" aria-expanded="false" aria-controls="pedidos">📌 Pedidos</button><button id="lembBtn" type="button" aria-expanded="false" aria-controls="lemb">⏰ Lembrete</button><button id="apagar" type="button">🗑 Apagar</button></div>
<div id="pedidos" hidden role="region" aria-label="Pedidos marcados nesta conversa"></div>
<div id="lemb" hidden><input id="lembTexto" placeholder="O que preciso devolver a ela? (opcional)" maxlength="120" autocomplete="off" aria-label="Anotação do lembrete"><div class="ch" id="lembRap"></div><div class="lin"><input id="lembQuando" type="datetime-local" aria-label="Data e hora do lembrete"><button id="lembOk" type="button">Agendar</button><button id="lembDel" type="button">Remover</button></div></div><div id="msgs" aria-live="polite"><p class="empty">Escolha uma conversa.</p></div>
<div id="rap"></div><input id="busca" placeholder="🔎 Buscar produto do catálogo para enviar (ex.: astro)" autocomplete="off" aria-label="Buscar produto" hidden><div id="res"></div>
<div id="aviso"></div>
<div id="grav" aria-live="polite"></div>
<form id="f"><label class="clip" aria-label="Enviar foto"><input id="foto" class="sr" type="file" accept="image/*"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></label><label class="clip" aria-label="Guardar arquivo na conversa (a cliente não vê)" title="Guardar arquivo na conversa — só você vê"><input id="arq" class="sr" type="file" accept=".svg,.pdf,.zip,.stl,.gcode,.dxf,.txt,.png,.jpg,.jpeg"><span aria-hidden="true">🗂</span></label><button class="clip" id="lupa" type="button" aria-label="Buscar produto do catálogo para enviar" aria-expanded="false" title="Buscar produto do catálogo para enviar">🔎</button><button class="clip mic" id="mic" type="button" aria-label="Gravar áudio" title="Gravar áudio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4"/></svg></button><textarea id="txt" rows="1" placeholder="Responder" autocomplete="off" aria-label="Sua resposta"></textarea><button>Responder</button></form></div>
</div>
</div>
</div>
<div id="dlgMarca" role="dialog" aria-modal="true" aria-labelledby="mTitulo" hidden><form id="fMarca"><b id="mTitulo"></b><label>Nome do pedido<input id="mNome" maxlength="60" autocomplete="off" placeholder="ex.: Logomarca DV (pode deixar em branco)"></label><div class="lin" id="mEnvio"><span style="font-size:.85rem;color:var(--mute);align-self:center">Envio:</span><button type="button" class="sec" data-env="SEDEX">SEDEX</button><button type="button" class="sec" data-env="PAC">PAC</button><button type="button" class="sec" data-env="FRETE">Frete</button></div><label>Origem<select id="mOrig"><option value="">Não definido</option><option value="catalogo">Do catálogo</option><option value="novo">Novo (logomarca / criação)</option></select></label><div id="mCat" hidden><input id="mBusca" placeholder="🔎 Buscar modelo do catálogo (ex.: rena)" autocomplete="off" aria-label="Buscar modelo do catálogo"><div id="mRes"></div><div id="mSel"></div><div id="mItens" hidden><label>Modelo e tamanho do catálogo<select id="mItem"></select></label></div></div><label>Tamanho<input id="mTam" maxlength="30" autocomplete="off" placeholder="ex.: 5 cm"></label><label>Preço (R$)<input id="mPreco" inputmode="decimal" autocomplete="off" maxlength="9" pattern="\d+([.,]\d{1,2})?" title="Só números, ex.: 22,00" placeholder="ex.: 22,00 (em branco se ainda não souber)"></label><label>Observações<textarea id="mObs" rows="3" maxlength="500" placeholder="ex.: sem o texto, cliente quer só o símbolo"></textarea></label><label>Estado<select id="mEst"></select></label><div class="lin"><button>Salvar</button><button type="button" class="sec" id="mCan">Cancelar</button><button type="button" id="mDel">Remover marcação</button></div></form></div>
<div id="zoom" role="dialog" aria-label="Foto ampliada"><img alt="Foto ampliada"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDocs,deleteDoc,collection,query,orderBy,limit,onSnapshot,serverTimestamp,writeBatch,getDoc,arrayUnion,arrayRemove,deleteField} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
import {CATALOGO_URL,RESPOSTAS,SITUACOES} from "./loja-config.js";

const $=i=>document.getElementById(i);
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let cur=null,offList=null,offMsgs=null,chats=[];

function erro(t){$("erro").textContent=t}

// ---- som de aviso (gerado pelo navegador, sem arquivo) ----
let somOn=true,ctx=null;
try{somOn=localStorage.getItem("som")!=="off"}catch(e){}
function mostrarSom(){$("som").textContent=somOn?"🔔 Som ligado":"🔕 Som desligado";$("som").setAttribute("aria-pressed",somOn)}
function preparar(){
  try{
    if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==="suspended")ctx.resume();
  }catch(e){}
}
function plim(){
  if(!somOn)return;
  preparar();if(!ctx)return;
  const t=ctx.currentTime;
  [[880,0],[1318.5,.14]].forEach(([f,d])=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t+d);
    g.gain.exponentialRampToValueAtTime(0.6,t+d+.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d+.5);
    o.connect(g);g.connect(ctx.destination);

const nomeSeguro=n=>n.replace(/[<>:"\/\\|?*\x00-\x1f]/g," ").replace(/\s+/g," ").trim().replace(/^[ .]+|[ .]+$/g,"").slice(0,150);
const chaveNome=t=>t.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().split(/\s+/).filter(Boolean).join(" ");
const bdPasta=()=>new Promise((ok,no)=>{const r=indexedDB.open("kellen-painel",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function lerPasta(){try{const d=await bdPasta();return await new Promise(ok=>{const r=d.transaction("h").objectStore("h").get("clientes");r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}catch(e){return null}}
async function guardarPasta(h){try{const d=await bdPasta();d.transaction("h","readwrite").objectStore("h").put(h,"clientes")}catch(e){}}
async function pastaClientes(){
  if(!window.showDirectoryPicker)throw new Error("use o Chrome ou o Edge no computador para salvar em pastas");
  let h=await lerPasta();
  if(h){
    try{if(await h.queryPermission({mode:"readwrite"})!=="granted"&&await h.requestPermission({mode:"readwrite"})!=="granted")h=null}catch(e){h=null}
  }
  if(!h){
    h=await showDirectoryPicker({id:"clientes",mode:"readwrite",startIn:"desktop"});
    await guardarPasta(h);
  }
  return h;
}
async function subpasta(pai,nome){
  for await(const [n,h] of pai.entries())if(h.kind==="directory"&&chaveNome(n)===chaveNome(nome))return h;
  return pai.getDirectoryHandle(nome,{create:true});
}
async function bytesDaFoto(src){
  if(src.startsWith("data:")){
    const i=src.indexOf(","),mime=(/^data:([^;,]+)/.exec(src)||[])[1]||"image/png";
    return {mime,bytes:Uint8Array.from(atob(src.slice(i+1)),c=>c.charCodeAt(0))};
  }
  const r=await fetch(src),b=await r.blob();
  return {mime:b.type||"image/png",bytes:new Uint8Array(await b.arrayBuffer())};
}
async function gravarLogo(raiz,cliente,nome,src){
  const pCliente=await subpasta(raiz,cliente),pLogo=await subpasta(pCliente,nome);
  const {mime,bytes}=await bytesDaFoto(src);
  const ext=({"image/jpeg":".jpg","image/png":".png","image/webp":".webp","image/gif":".gif"})[mime]||".png";
  let arq=nome+ext,n=2;
  for(;;){try{await pLogo.getFileHandle(arq)}catch(e){break}arq=nome+" ("+n+++")"+ext}
  const w=await (await pLogo.getFileHandle(arq,{create:true})).createWritable();
  await w.write(bytes);await w.close();
  return "Clientes\\"+cliente+"\\"+nome+"\\"+arq;
}
async function salvarLogo(img){
  const c=chats.find(x=>x.id===cur),cliente=nomeSeguro((c&&c.nome)||"");

  return "✔ Salva em "+caminho+"."+copiou;
}

function linhasDoPedido(texto){

  });

async function separarPedido(msgId){

  if(!chatId||!msg||!msg.texto)return false;
  if(c&&c.separados&&c.separados[msgId]){avisoRapido("Este pedido já foi separado em itens.");return false}
  const linhas=linhasDoPedido(msg.texto);
  if(!linhas.length){erro("Não encontrei itens numerados nesta mensagem.");return false}
  let n=proximoN()-1;const marcas={};
  linhas.forEach((l,i)=>{
    n++;
    const tm=l.nome.match(/^(.*\S)\s+(\d+(?:[.,]\d+)?\s*cm)$/i);
    const prod=produtos.find(p=>(p.itens||[]).some(q=>q.nome===l.nome));
    const it=prod&&prod.itens.find(q=>q.nome===l.nome);
    const preco=l.preco!=null?l.preco:(it&&it.preco!=null?it.preco:null);
    marcas[msgId+"_i"+(i+1)]={n,nome:tm?tm[1]:l.nome,tamanho:tm?tm[2].replace(/\s+/g,""):"",preco,obs:"",estado:ESTADOS[0],origem:"catalogo",
      modelo:prod?{titulo:prod.titulo,tema:prod.tema||"",url:prod.url||""}:null,msg:msgId,em:Date.now()};
  });
  erro("");
  try{
    await setDoc(doc(db,"chats",chatId),{marcas,marcaSeq:n,separados:{[msgId]:true}},{merge:true});
    avisoRapido("✔ "+linhas.length+(linhas.length===1?" item separado":" itens separados")+". Veja em 📌 Pedidos.");
    return true;
  }catch(err){erro("Não consegui separar: "+(err.code||err.message));return false}
}

// reduz a foto até caber com folga no limite de 1 MB por documento do Firestore
function reduzir(file){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      for(const [lado,q] of [[1000,.7],[800,.6],[600,.5],[400,.5]]){
        const r=Math.min(1,lado/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));
        const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
        x.drawImage(img,0,0,c.width,c.height);
        const d=c.toDataURL("image/jpeg",q);
        if(d.length<900000)return ok(d);
      }
      no(new Error("imagem grande demais"));
    };
    img.onerror=()=>no(new Error("formato de imagem não aceito"));
    img.src=url;
  });
}

const MAX_SEG=60;
const relogio=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const players=new Map(); // reaproveita o player para o áudio não parar quando chega mensagem
function player(id,src){
  let a=players.get(id);
  if(!a){a=document.createElement("audio");a.controls=true;a.preload="metadata";a.src=src;players.set(id,a)}
  return a;
}
function criarGravador({botao,barra,destino,mandar,falhar,dica}){
  let atual=null;
  const botaoBarra=(t,fn,cls)=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.onclick=fn;if(cls)b.className=cls;return b};
  function mostrar(texto,...itens){
    const s=document.createElement("span");s.textContent=texto;
    barra.replaceChildren(s,...itens);barra.classList.add("on");
    return s;
  }
  function soltar(g){clearInterval(g.relogio);if(g.stream)g.stream.getTracks().forEach(t=>t.stop())}
  function descartar(){
    const g=atual;atual=null;
    if(g){soltar(g);if(g.rec&&g.rec.state!=="inactive")g.rec.stop()}
    barra.replaceChildren();barra.classList.remove("on");
  }
  function revisar(g){
    const tipo=g.rec.mimeType||g.partes[0]?.type||"audio/webm";
    const leitor=new FileReader();
    leitor.onload=()=>{
      if(atual!==g)return;
      const dados=String(leitor.result).replace(/^data:video\//,"data:audio/");
      if(!g.partes.length){descartar();falhar("A gravação saiu vazia. Tente de novo.");return}
      if(dados.length>900000){descartar();falhar("Esse áudio ficou grande demais. Grave um mais curto.");return}
      const a=document.createElement("audio");a.controls=true;a.src=dados;
      const ok=botaoBarra("Enviar áudio",async()=>{
        ok.disabled=nao.disabled=true;ok.textContent="Enviando…";falhar("");
        try{await mandar(g.alvo,dados,g.seg);if(atual===g)descartar()}
        catch(e){ok.disabled=nao.disabled=false;ok.textContent="Enviar áudio";falhar("Não consegui enviar o áudio: "+(e.code||e.message))}
      });
      const nao=botaoBarra("Apagar",descartar,"sec");
      mostrar("Ouça antes de enviar:",a,ok,nao);
    };
    leitor.readAsDataURL(new Blob(g.partes,{type:tipo}));
  }
  botao.onclick=async()=>{
    if(atual)return;
    const alvo=destino();if(!alvo)return;
    falhar("");
    if(!navigator.mediaDevices||!window.MediaRecorder){falhar("Este navegador não grava áudio. Abra no Chrome ou no Safari.");return}
    const g=atual={alvo,partes:[],seg:0};
    mostrar("Liberando o microfone…",botaoBarra("Cancelar",descartar,"sec"));
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      if(atual!==g){stream.getTracks().forEach(t=>t.stop());return}
      g.stream=stream;
      const tipo=["audio/mp4;codecs=mp4a.40.2","audio/webm;codecs=opus","audio/webm","audio/mp4"].find(t=>MediaRecorder.isTypeSupported(t));
      g.rec=new MediaRecorder(stream,{...(tipo?{mimeType:tipo}:{}),audioBitsPerSecond:32000});
      g.rec.ondataavailable=e=>{if(e.data.size)g.partes.push(e.data)};
      g.rec.onstop=()=>{soltar(g);if(atual===g)revisar(g)};
      g.rec.start();
      const parar=()=>{clearInterval(g.relogio);if(g.rec.state!=="inactive")g.rec.stop()};
      const texto=()=>"🔴 Gravando "+relogio(g.seg)+" de "+relogio(MAX_SEG)+(dica?" · "+dica:"");
      const s=mostrar(texto(),botaoBarra("⏹ Parar",parar),botaoBarra("Cancelar",descartar,"sec"));
      const inicio=Date.now();
      g.relogio=setInterval(()=>{g.seg=Math.min(MAX_SEG,Math.floor((Date.now()-inicio)/1000));s.textContent=texto();if(g.seg>=MAX_SEG)parar()},250);
    }catch(e){
      if(atual!==g)return;
      descartar();
      falhar(e.name==="NotAllowedError"?"O microfone está bloqueado. Libere o microfone para este site nas permissões do navegador.":"Não consegui usar o microfone: "+(e.message||e.name));
    }
  };
  return {descartar};
}

async function pastaDaCliente(){
  const h=await lerPasta();if(!h)return null;
  if(await h.queryPermission({mode:"read"})!=="granted"&&await h.requestPermission({mode:"read"})!=="granted")return null;
  const c=chats.find(x=>x.id===cur),nome=nomeSeguro((c&&c.nome)||"");
  if(nome)for await(const [n,x] of h.entries())if(x.kind==="directory"&&chaveNome(n)===chaveNome(nome))return {h:x,achou:true,nome};
  return {h,achou:false,nome};
}

// ---- pendências: resumo de quem espera retorno (calculado a partir das conversas já carregadas) ----
// Edite aqui: situações em que vale cobrar a cliente e situação que indica produção / envio concluído
const COBRAR=["Orçamento","Aguardando Pix"],ANDAMENTO=["Em produção"],CONCLUIDO="Enviado";
const msDe=c=>c.atualizado&&c.atualizado.toMillis?c.atualizado.toMillis():0;
function faz(t){
  if(!t)return "";
  const m=Math.max(0,Math.round((Date.now()-t)/60000));
  if(m<1)return "agora";if(m<60)return m+" min";
  const h=Math.floor(m/60);if(h<24)return h+" h";
  const d=Math.floor(h/24);return d+(d===1?" dia":" dias");
}
function pendencias(){
  const esp=[],cob=[],lem=[],and=[],agora=Date.now();
  chats.forEach(c=>{
    const voce=(c.ultima||"").startsWith("Você:");
    const espera=(c.naoLidas>0||(c.ultima&&!voce))&&!(c.situacao===CONCLUIDO&&!c.naoLidas);
    if(espera)esp.push(c);else if(COBRAR.includes(c.situacao))cob.push(c);
    if(c.lembreteEm)lem.push(c);
    if(ANDAMENTO.includes(c.situacao))and.push(c);
  });
  esp.sort((a,b)=>msDe(a)-msDe(b));cob.sort((a,b)=>msDe(a)-msDe(b));lem.sort((a,b)=>a.lembreteEm-b.lembreteEm);and.sort((a,b)=>msDe(a)-msDe(b));
  const ids=new Set(esp.map(c=>c.id));lem.forEach(c=>{if(c.lembreteEm<=agora)ids.add(c.id)});
  return {esp,cob,lem,and,total:ids.size};
}

    sec("Lembretes:",p.lem,c=>fmtLemb(c.lembreteEm)+(c.lembreteTexto?" · "+c.lembreteTexto:""));
    sec("Esperando a cliente (vale cobrar):",p.cob,c=>"["+c.situacao+"] há "+faz(msDe(c)));
    sec("Em produção:",p.and,c=>"há "+faz(msDe(c)));
    try{await navigator.clipboard.writeText(L.join("\n").trim()||"Nenhuma pendência.");avisoRapido("✔ Resumo copiado.")}catch(e){erro("Não consegui copiar o resumo.")}
  },"sec"));
  box.appendChild(topo);
  let algum=false;
  const sec=(titulo,arr,detalhe,cls)=>{
    if(!arr.length)return;algum=true;
    const h=document.createElement("h3");h.textContent=titulo+" ("+arr.length+")";box.appendChild(h);
    arr.forEach(c=>{
      const row=document.createElement("div");row.className="a";

      row.append(sp,btn("Abrir",()=>{abrir(c.id);box.classList.remove("on");$("resBtn").setAttribute("aria-expanded","false")}));
      box.appendChild(row);
    });
  };
  sec("Esperando sua resposta",p.esp,c=>"há "+faz(msDe(c))+(c.naoLidas?" · "+c.naoLidas+" não lida(s)":""));
  sec("Lembretes",p.lem,c=>"⏰ "+fmtLemb(c.lembreteEm)+(c.lembreteTexto?" · "+c.lembreteTexto:""),c=>c.lembreteEm<=Date.now()?"lemb-due":"");
  sec("Esperando a cliente (vale cobrar)",p.cob,c=>"["+c.situacao+"] sem resposta há "+faz(msDe(c)));
  sec("Em produção",p.and,c=>"última atividade há "+faz(msDe(c)));
  if(!algum){const v=document.createElement("p");v.className="vazio";v.textContent="Nenhuma pendência no momento 🎉";box.appendChild(v)}
}

// ---- lista geral: itens marcados em todas as conversas carregadas (as 50 mais recentes) ----
let itensFeitos=false;
function itensGerais(){
  const out=[];
  chats.forEach(c=>Object.entries(c.marcas||{}).forEach(([mid,m])=>{if(itensFeitos||m.estado!=="Feito")out.push({c,mid,m})}));
  return out.sort((a,b)=>(a.m.em||0)-(b.m.em||0));
}
function gruposItens(L){
  const g={cat:new Map(),novo:[],nd:[]};
  L.forEach(x=>{
    if(x.m.origem==="catalogo"){const k=(x.m.modelo&&x.m.modelo.titulo)||"(modelo não escolhido)";if(!g.cat.has(k))g.cat.set(k,[]);g.cat.get(k).push(x)}
    else if(x.m.origem==="novo")g.novo.push(x);
    else g.nd.push(x);
  });
  return g;
}
const linhaItem=x=>(x.c.nome||"cliente")+" · #"+x.m.n+" "+x.m.nome+(x.m.tamanho?" · "+x.m.tamanho:"")+" · "+(x.m.estado||ESTADOS[0]);
function secoesItens(g){
  const s=[];
  [...g.cat.keys()].sort((a,b)=>a.localeCompare(b,"pt-BR")).forEach(k=>s.push(["📖 "+k,g.cat.get(k)]));
  if(g.novo.length)s.push(["🆕 Novos (logomarca / criação)",g.novo]);
  if(g.nd.length)s.push(["❔ Sem origem definida",g.nd]);
  return s;
}
async function copiarItens(){
  const S=secoesItens(gruposItens(itensGerais()));
  const t="Itens para organizar\n"+S.map(([t,a])=>"\n"+t+" ("+a.length+")\n"+a.map(x=>"  • "+linhaItem(x)+(x.m.obs?" — "+x.m.obs.replace(/\n/g," "):"")).join("\n")).join("\n");
  try{await navigator.clipboard.writeText(S.length?t:"Nenhum item marcado.");avisoRapido("✔ Lista copiada.")}catch(e){erro("Não consegui copiar a lista.")}
}
function desenharItens(){
  const box=$("itens"),L=itensGerais();
  $("itensBtn").textContent="📌 Itens"+(L.length?" ("+L.length+")":"");
  if(!box.classList.contains("on"))return;
  box.textContent="";
  const topo=document.createElement("div");topo.className="topo";
  const info=document.createElement("span");info.textContent=L.length+(L.length===1?" item":" itens")+(itensFeitos?" (com os feitos)":" para organizar")+" · "+chats.length+" conversas recentes";
  topo.append(info,btn(itensFeitos?"Ocultar feitos":"Mostrar feitos",()=>{itensFeitos=!itensFeitos;desenharItens()}),btn("Copiar lista",copiarItens));
  box.appendChild(topo);
  if(!L.length){const v=document.createElement("div");v.className="vazio";v.textContent="Nenhum item marcado. Use o 📌 Marcar numa mensagem da conversa.";box.appendChild(v);return}
  secoesItens(gruposItens(L)).forEach(([titulo,arr])=>{
    const h=document.createElement("h3");h.textContent=titulo+" ("+arr.length+")";box.appendChild(h);
    arr.forEach(x=>{
      const row=document.createElement("div");row.className="a";
      const sp=document.createElement("span");sp.textContent=linhaItem(x);
      if(x.m.obs){const o=document.createElement("small");o.textContent=x.m.obs;sp.appendChild(o)}
      row.append(sp,btn("Abrir",()=>{abrir(x.c.id);box.classList.remove("on");$("itensBtn").setAttribute("aria-expanded","false")}));
      box.appendChild(row);
    });
  });
}
