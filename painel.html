<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de atendimento</title>
<link rel="manifest" href="manifest-painel.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#6B2D5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<style>
:root{--bg:#F6F2FA;--surf:#fff;--ink:#2A1F2D;--mute:#6D6174;--line:#E4DCEC;--berry:#6B2D5C;--butter:#FFE9A8;--theirs:#EFE8F5}
@media(prefers-color-scheme:dark){:root{--bg:#1B1420;--surf:#261C2C;--ink:#F3ECF7;--mute:#B2A5BA;--line:#3A2D42;--berry:#E7A6D6;--theirs:#34273C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;line-height:1.4}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 12px}
#login{max-width:340px;display:flex;flex-direction:column;gap:8px}
input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;min-width:0}
button{border:0;background:var(--berry);color:#fff;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#2A1F2D}}
button:focus-visible,input:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
#erro{color:#B3261E;margin:8px 0}
#desk{display:none;background:var(--surf);border:2px solid var(--line);border-radius:18px;overflow:hidden}
.top{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.top span{color:var(--mute);font-size:.85rem}
.top button{background:none;color:var(--mute);border:1px solid var(--line);padding:4px 10px;font-weight:400}
.cols{display:grid;grid-template-columns:230px 1fr;min-height:460px}
@media(max-width:600px){.cols{grid-template-columns:1fr}}
#list{border-right:1px solid var(--line);overflow:auto;max-height:560px}
@media(max-width:600px){#list{border-right:0;border-bottom:1px solid var(--line);max-height:200px}}
#list button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:6px;text-align:left;border-radius:0;background:none;color:var(--ink);font-weight:400;border-bottom:1px solid var(--line);padding:12px 14px}
#list button[aria-current="true"]{background:var(--theirs)}
#list small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.badge{background:var(--berry);color:#fff;border-radius:999px;min-width:22px;text-align:center;font-size:.75rem;padding:1px 6px}
@media(prefers-color-scheme:dark){.badge{color:#2A1F2D}}
.conv{display:flex;flex-direction:column;padding:12px;min-height:320px}
.titulo{font-weight:700;padding:0 0 8px;margin-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
#apagar{display:none;background:none;color:#B3261E;border:1px solid var(--line);padding:4px 10px;font-weight:400}
@media(prefers-color-scheme:dark){#apagar{color:#F2B8B5}}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;max-height:460px}
.m{max-width:80%;padding:8px 11px;border-radius:16px;word-wrap:break-word;white-space:pre-wrap}
.m small{display:block;opacity:.65;font-size:.7rem;margin-top:2px}
.m img{display:block;width:260px;max-width:100%;max-height:320px;object-fit:cover;border-radius:10px;cursor:zoom-in;margin-bottom:4px}
.me{align-self:flex-end;background:var(--berry);color:#fff;border-bottom-right-radius:4px}
@media(prefers-color-scheme:dark){.me{color:#2A1F2D}}
.other{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:4px}
.empty{color:var(--mute);margin:auto;text-align:center}
#f{display:flex;gap:6px;margin-top:8px}
#f input[type=text],#f input:not([type]){flex:1}
.clip{display:grid;place-items:center;flex:none;width:44px;border:1px solid var(--line);border-radius:10px;color:var(--berry);cursor:pointer}
.clip:focus-within{outline:3px solid var(--butter);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;padding:0;border:0;opacity:0;overflow:hidden}
#aviso{color:var(--mute);font-size:.85rem;margin-top:6px;display:none}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#zoom.on{display:flex}
#zoom img{max-width:100%;max-height:100%;border-radius:8px}
.pc{display:block;text-decoration:none;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:4px}
.pc img{display:block;width:220px;max-width:100%;max-height:220px;object-fit:cover;margin:0;border-radius:0;cursor:pointer}
.pc b{display:block;padding:6px 10px 0}
.pc span{display:block;padding:0 10px 8px;font-size:.8rem;color:var(--mute)}
#rap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#rap button{background:none;color:var(--berry);border:1px solid var(--line);padding:4px 10px;font-weight:500;font-size:.85rem}
#busca{width:100%;margin-top:8px}
#res{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;color:var(--mute);font-size:.85rem}
#res button{display:flex;align-items:center;gap:6px;background:var(--theirs);color:var(--ink);font-weight:500;padding:4px 10px 4px 4px;font-size:.85rem}
#res img{width:36px;height:36px;object-fit:cover;border-radius:6px}
#sit{display:none;font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:3px 6px}
</style>
</head>
<body>
<div class="wrap">
<h1>Painel de atendimento</h1>
<form id="login"><input id="em" type="email" placeholder="Seu e-mail" autocomplete="username"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password"><button>Entrar</button></form>
<div id="erro"></div>
<div id="desk">
<div class="top"><b>Conversas</b><span id="count"></span><button id="som" type="button" aria-pressed="true">🔔 Som ligado</button><button id="sair" type="button">Sair</button></div>
<div class="cols">
<div id="list"></div>
<div class="conv"><div class="titulo"><span id="titulo">Nenhuma conversa aberta</span><select id="sit" aria-label="Situação da conversa"></select><button id="apagar" type="button">🗑 Apagar</button></div><div id="msgs" aria-live="polite"><p class="empty">Escolha uma conversa.</p></div>
<div id="rap"></div><input id="busca" placeholder="🔎 Buscar produto do catálogo para enviar (ex.: astro)" autocomplete="off" aria-label="Buscar produto"><div id="res"></div>
<div id="aviso"></div>
<form id="f"><label class="clip" aria-label="Enviar foto"><input id="foto" class="sr" type="file" accept="image/*"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></label><input id="txt" placeholder="Responder" autocomplete="off" aria-label="Sua resposta"><button>Responder</button></form></div>
</div>
</div>
</div>
<div id="zoom" role="dialog" aria-label="Foto ampliada"><img alt="Foto ampliada"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDocs,deleteDoc,collection,query,orderBy,limit,onSnapshot,serverTimestamp,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
import {CATALOGO_URL,RESPOSTAS,SITUACOES} from "./loja-config.js";

const $=i=>document.getElementById(i);
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let cur=null,offList=null,offMsgs=null,chats=[];

function erro(t){$("erro").textContent=t}

// ---- som de aviso (gerado pelo navegador, sem arquivo) ----
let somOn=true,ctx=null;
try{somOn=localStorage.getItem("som")!=="off"}catch(e){}
function mostrarSom(){$("som").textContent=somOn?"🔔 Som ligado":"🔕 Som desligado";$("som").setAttribute("aria-pressed",somOn)}
function preparar(){
  try{
    if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==="suspended")ctx.resume();
  }catch(e){}
}
function plim(){
  if(!somOn)return;
  preparar();if(!ctx)return;
  const t=ctx.currentTime;
  [[880,0],[1318.5,.14]].forEach(([f,d])=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t+d);
    g.gain.exponentialRampToValueAtTime(0.6,t+d+.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+d+.5);
    o.connect(g);g.connect(ctx.destination);
    o.start(t+d);o.stop(t+d+.55);
  });
}
// o navegador só libera o som depois de um toque/clique na página
document.addEventListener("pointerdown",preparar);
document.addEventListener("keydown",preparar);
$("som").onclick=()=>{somOn=!somOn;try{localStorage.setItem("som",somOn?"on":"off")}catch(e){}mostrarSom();if(somOn)plim()};
mostrarSom();
function hora(ts){var d=ts&&ts.toDate?ts.toDate():new Date();return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
function ampliar(src){$("zoom").firstElementChild.src=src;$("zoom").classList.add("on")}
$("zoom").onclick=()=>$("zoom").classList.remove("on");

function desenharLista(){
  const l=$("list");l.innerHTML="";let aguardando=0;
  chats.forEach(c=>{
    if(c.naoLidas)aguardando++;
    const b=document.createElement("button");b.setAttribute("aria-current",c.id===cur);
    const w=document.createElement("div");w.innerHTML="<b></b><small></small>";
    w.firstChild.textContent=c.nome||"Cliente";w.lastChild.textContent=(c.situacao?"["+c.situacao+"] ":"")+(c.ultima||"");
    b.appendChild(w);
    if(c.naoLidas&&c.id!==cur){const s=document.createElement("span");s.className="badge";s.textContent=c.naoLidas;b.appendChild(s)}
    b.onclick=()=>abrir(c.id);
    l.appendChild(b);
  });
  if(!chats.length)l.innerHTML='<p class="empty" style="padding:16px">Nenhuma conversa ainda.</p>';
  if(cur){const cc=chats.find(x=>x.id===cur);if(cc)$("sit").value=cc.situacao||""}
  $("count").textContent=aguardando?aguardando+" aguardando resposta":"Tudo respondido";
  document.title=aguardando?"("+aguardando+") Painel de atendimento":"Painel de atendimento";
}

function abrir(id){
  cur=id;
  $("apagar").style.display="inline-block";$("sit").style.display="inline-block";
  if(offMsgs)offMsgs();
  const c0=chats.find(c=>c.id===id);$("titulo").textContent=c0?(c0.nome||"Cliente"):"";
  setDoc(doc(db,"chats",id),{naoLidas:0},{merge:true});
  const q=query(collection(db,"chats",id,"messages"),orderBy("criado"));
  let primeira=true;
  offMsgs=onSnapshot(q,snap=>{
    // conversa aberta: toca quando chega mensagem nova do cliente
    if(!primeira&&snap.docChanges().some(ch=>ch.type==="added"&&!ch.doc.metadata.hasPendingWrites&&ch.doc.data().de==="cliente"))plim();
    primeira=false;
    const box=$("msgs");box.innerHTML="";
    snap.forEach(d=>{
      const m=d.data(),el=document.createElement("div");
      el.className="m "+(m.de==="loja"?"me":"other");
      if(m.tipo==="produto"&&okUrl(m.url)&&(!m.imagem||okUrl(m.imagem))){el.appendChild(cartao(m.titulo,m.url,m.imagem))}else if(m.imagem){
        const i=document.createElement("img");i.src=m.imagem;i.alt="Foto enviada";
        i.onclick=()=>ampliar(m.imagem);i.onload=()=>{box.scrollTop=box.scrollHeight};
        el.appendChild(i);
      }
      if(m.texto)el.appendChild(document.createTextNode(m.texto));
      const s=document.createElement("small");s.textContent=hora(m.criado);el.appendChild(s);
      box.appendChild(el);
    });
    box.scrollTop=box.scrollHeight;
    // se chegou mensagem nova com a conversa aberta, zera o contador
    const ult=chats.find(c=>c.id===id);if(ult&&ult.naoLidas)setDoc(doc(db,"chats",id),{naoLidas:0},{merge:true});
  });
  desenharLista();
}

function iniciar(){
  $("login").style.display="none";$("desk").style.display="block";erro("");
  // mostra só as 50 conversas mais recentes
  const q=query(collection(db,"chats"),orderBy("atualizado","desc"),limit(50));
  let antes=null;
  offList=onSnapshot(q,snap=>{
    const novos=snap.docs.map(d=>({id:d.id,...d.data()}));
    // outras conversas: toca quando o contador de não lidas sobe
    if(antes&&novos.some(c=>c.id!==cur&&(c.naoLidas||0)>(antes[c.id]||0)))plim();
    antes={};novos.forEach(c=>{antes[c.id]=c.naoLidas||0});
    chats=novos;
    desenharLista();
  },e=>erro("Não consegui ler as conversas: "+e.code+" (confira as regras do Firestore)"));
}

$("login").onsubmit=async e=>{
  e.preventDefault();erro("");
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
  catch(err){erro("Não entrou: "+err.code)}
};
$("sair").onclick=()=>signOut(auth);

function aviso(t){$("aviso").style.display=t?"block":"none";$("aviso").textContent=t||""}

// reduz a foto até caber com folga no limite de 1 MB por documento do Firestore
function reduzir(file){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      for(const [lado,q] of [[1000,.7],[800,.6],[600,.5],[400,.5]]){
        const r=Math.min(1,lado/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));
        const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
        x.drawImage(img,0,0,c.width,c.height);
        const d=c.toDataURL("image/jpeg",q);
        if(d.length<900000)return ok(d);
      }
      no(new Error("imagem grande demais"));
    };
    img.onerror=()=>no(new Error("formato de imagem não aceito"));
    img.src=url;
  });
}

$("foto").onchange=async()=>{
  const file=$("foto").files[0];$("foto").value="";
  if(!file)return;
  if(!cur){erro("Escolha uma conversa na lista antes de enviar a foto.");return}
  const legenda=$("txt").value.trim();
  erro("");aviso("Enviando foto…");
  try{
    const img=await reduzir(file);
    const b=writeBatch(db);
    b.set(doc(collection(db,"chats",cur,"messages")),{de:"loja",texto:legenda,imagem:img,criado:serverTimestamp()});
    b.set(doc(db,"chats",cur),{ultima:"Você: 📷 "+(legenda||"Foto"),atualizado:serverTimestamp(),naoLidas:0},{merge:true});
    await b.commit();
    $("txt").value="";
  }catch(err){erro("Não consegui enviar a foto: "+(err.code||err.message))}
  aviso("");
};

$("f").onsubmit=async e=>{
  e.preventDefault();
  const t=$("txt").value.trim();
  if(!t)return;
  if(!cur){erro("Escolha uma conversa na lista antes de responder.");return}
  erro("");$("txt").value="";
  const b=writeBatch(db);
  b.set(doc(collection(db,"chats",cur,"messages")),{de:"loja",texto:t,criado:serverTimestamp()});
  b.set(doc(db,"chats",cur),{ultima:"Você: "+t,atualizado:serverTimestamp(),naoLidas:0},{merge:true});
  try{await b.commit()}catch(err){erro("Não consegui enviar: "+err.code)}
};

// apaga a conversa inteira: primeiro as mensagens, depois o documento da conversa
$("apagar").onclick=async()=>{
  if(!cur)return;
  const id=cur,c=chats.find(x=>x.id===id);
  if(!confirm('Apagar a conversa com "'+((c&&c.nome)||"Cliente")+'"? Não tem volta.'))return;
  try{
    if(offMsgs){offMsgs();offMsgs=null}
    cur=null;
    $("titulo").textContent="Nenhuma conversa aberta";$("apagar").style.display="none";$("sit").style.display="none";
    $("msgs").innerHTML='<p class="empty">Escolha uma conversa.</p>';
    const snap=await getDocs(collection(db,"chats",id,"messages"));
    let b=writeBatch(db),n=0;
    for(const d of snap.docs){b.delete(d.ref);if(++n===400){await b.commit();b=writeBatch(db);n=0}}
    await b.commit();
    await deleteDoc(doc(db,"chats",id));
  }catch(err){erro("Não consegui apagar: "+(err.code||err.message))}
};


const okUrl=s=>typeof s==="string"&&s.startsWith(CATALOGO_URL);
const sem=s=>(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function cartao(t,u,i,sub){
  const a=document.createElement("a");a.className="pc";a.href=u;a.target="_blank";a.rel="noopener";
  if(i){const im=document.createElement("img");im.src=i;im.alt="";im.loading="lazy";a.appendChild(im)}
  const b=document.createElement("b");b.textContent=t||"Produto";a.appendChild(b);
  const s=document.createElement("span");s.textContent=sub||"Toque para ver os modelos";a.appendChild(s);
  return a;
}
// catálogo: produtos.json gerado pelo Gerenciador_de_Catálogo.py
let produtos=[];
fetch(CATALOGO_URL+"produtos.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{
  produtos=(j.produtos||[]).map(p=>({...p,_w:sem([p.titulo,p.tema,...(p.palavras||[])].join(" ")).split(/[^a-z0-9]+/).filter(Boolean)}));
}).catch(()=>{});

// situação da conversa
const sit=$("sit");
[["","Sem situação"],...SITUACOES.map(s=>[s,s])].forEach(([v,t])=>{const o=document.createElement("option");o.value=v;o.textContent=t;sit.appendChild(o)});
sit.onchange=()=>{if(cur)setDoc(doc(db,"chats",cur),{situacao:sit.value},{merge:true}).catch(e=>erro("Não consegui salvar a situação: "+e.code))};
// respostas rápidas (preenchem a caixa; você revisa e envia)
RESPOSTAS.forEach(([nome,texto])=>{
  const b=document.createElement("button");b.type="button";b.textContent=nome;b.title=texto;
  b.onclick=()=>{$("txt").value=texto;$("txt").focus()};$("rap").appendChild(b);
});
// buscar produto e enviar na conversa
async function enviarProduto(p){
  if(!cur){erro("Escolha uma conversa na lista antes de enviar o produto.");return}
  erro("");
  const b=writeBatch(db);
  b.set(doc(collection(db,"chats",cur,"messages")),{de:"loja",tipo:"produto",titulo:p.titulo,url:CATALOGO_URL+p.url,imagem:p.imagem?CATALOGO_URL+p.imagem:"",texto:$("txt").value.trim(),criado:serverTimestamp()});
  b.set(doc(db,"chats",cur),{ultima:"Você: 🛍 "+p.titulo,atualizado:serverTimestamp(),naoLidas:0},{merge:true});
  try{await b.commit();$("txt").value="";$("busca").value="";$("res").textContent=""}catch(err){erro("Não consegui enviar: "+(err.code||err.message))}
}
$("busca").oninput=()=>{
  const r=$("res");r.textContent="";
  const ws=sem($("busca").value).split(/[^a-z0-9]+/).filter(Boolean);
  if(!ws.length)return;
  produtos.filter(p=>ws.every(w=>p._w.some(k=>k.startsWith(w)))).slice(0,8).forEach(p=>{
    const b=document.createElement("button");b.type="button";
    if(p.imagem){const im=document.createElement("img");im.src=CATALOGO_URL+p.imagem;im.alt="";b.appendChild(im)}
    b.appendChild(document.createTextNode(p.titulo+" ("+p.tema+")"));
    b.onclick=()=>enviarProduto(p);r.appendChild(b);
  });
  if(!r.children.length)r.textContent=produtos.length?"Nenhum produto encontrado.":"Catálogo ainda não carregou (gere o produtos.json).";
};

onAuthStateChanged(auth,u=>{
  if(u&&u.email)iniciar();
  else{
    if(offList)offList();if(offMsgs)offMsgs();
    $("desk").style.display="none";$("login").style.display="flex";
  }
});
</script>
</body>
</html>
